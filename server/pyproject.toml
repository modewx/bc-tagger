[project]
name = "bc-tagger-server"
version = "0.1.0"
description = "bc-tagger local server: file index, matching, ownership and rekordbox export"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyrekordbox>=0.5,<0.6",
    "mutagen>=1.47",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bct = "bc_tagger_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bc_tagger_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
