<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="jquery_2.1.1_jquery.min.js"></script>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      width: 240px;
      margin: 0;
      padding: 12px;
      font-size: 13px;
    }
    /* The collection the tagger shows and stars into (Phase 9) */
    #collectionRow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    #collectionRow label { font-weight: 600; flex: none; }
    #collectionPicker { flex: 1; min-width: 0; font-size: 13px; padding: 4px; }
    /* All is a special mode (Phase 9b): said while it's chosen */
    #allWarning { display: none; margin: -6px 0 10px; padding: 5px 8px; border: 1px solid #f0b46c; border-radius: 5px; background: #fff4e5; color: #7a4100; font-size: 12px; }
    #allWarning.open { display: block; }
    #newCollectionRow { display: none; gap: 4px; margin: -4px 0 10px; }
    #newCollectionRow.open { display: flex; }
    #newCollectionRow input { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid #aaa; border-radius: 4px; font-size: 13px; }
    #newCollectionRow button { font-size: 12px; padding: 4px 8px; }
    /* Create tag (always visible, at the top) */
    #createTagSection {
      margin-bottom: 12px;
    }
    .combo {
      position: relative;
    }
    .combo input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 13px;
    }
    .combo-list {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      background: #fff;
      border: 1px solid #aaa;
      border-top: none;
      max-height: 170px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
    }
    .combo-list.open {
      display: block;
    }
    .combo-list div {
      padding: 6px 8px;
      cursor: pointer;
    }
    .combo-list div:hover {
      background: #3875d7;
      color: #fff;
    }
    .combo-list .exists {
      color: #999;
      font-style: italic;
    }
    #createTag {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #3875d7;
      border-radius: 5px;
      background: #3875d7;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    #createTag:hover {
      background: #2f66c0;
    }
    /* Secondary actions */
    .popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .popup-actions button,
    .popup-actions a {
      font-size: 13px;
      padding: 5px 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
      text-decoration: none;
      color: #222;
    }
    .popup-actions button.active {
      background: #3875d7;
      border-color: #3875d7;
      color: #fff;
    }
    .panel {
      display: none;
      margin-top: 12px;
    }
    .panel.open {
      display: block;
    }
    #allTags {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 4px 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .tag-row:last-child {
      border-bottom: none;
    }
    .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag-delete {
      border: none;
      background: transparent;
      color: #d9534f;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 1px 6px;
      border-radius: 3px;
      flex: none;
    }
    .tag-delete:hover {
      background: #d9534f;
      color: #fff;
    }
    .tag-count {
      color: #777;
      margin-bottom: 6px;
    }
    /* Local app / server status */
    .option-line {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }
    .option-line input { margin: 2px 0 0; }
    .option-line small { display: block; color: #888; font-size: 11px; }
    .server-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
    .server-line .dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
    }
    .server-line .dot.up { background: #2da44e; }
    .server-line .dot.down { background: #d9534f; }
    #serverText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-btn {
      border: none;
      background: none;
      color: #3875d7;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }
    #serverEditRow { display: none; margin-top: 6px; gap: 4px; }
    #serverEditRow.open { display: flex; }
    #serverEditRow input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 12px;
    }
    #serverEditRow button { font-size: 12px; padding: 4px 8px; }
    /* toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      background: #d9534f;
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90%;
    }
    #toast.show {
      opacity: 1;
    }
    #toast.success {
      background: #5cb85c;
    }
  </style>
</head>
<body>
  <div id="collectionRow">
    <label for="collectionPicker">Collection</label>
    <select id="collectionPicker" title="What the stars on Bandcamp pages show, and where starring puts a track"></select>
  </div>
  <div id="allWarning" role="note">All: stars go into every collection; un-star deletes from all.</div>
  <div id="newCollectionRow">
    <input type="text" id="newCollectionName" placeholder="Name of the new collection" autocomplete="off" maxlength="100" />
    <button id="newCollectionCreate">Create</button>
    <button id="newCollectionCancel" class="link-btn">Cancel</button>
  </div>
  <div id="createTagSection">
    <div class="combo">
      <input type="text" id="tagName" placeholder="New tag (one word)" autocomplete="off" autofocus />
      <div id="tagSuggestions" class="combo-list"></div>
    </div>
    <button id="createTag">Create Tag</button>
  </div>

  <div class="popup-actions">
    <button id="seeCollection" title="Opens the local app when its server is running, otherwise the built-in page. Shift-click: always the built-in page.">See Collection</button>
    <button id="seeTags">See Tags</button>
    <a class="link-to-download" href="#" role="button">Export</a>
    <a id="importLink" href="#" role="button">Import</a>
    <a id="copyTimings" href="#" role="button" title="Copy how long the last tagger actions took (on screen, queue, write, push), to send when it's slow">Copy timings</a>
    <a id="devReload" href="#" role="button" hidden title="Reload this dev build">Reload (dev)</a>
  </div>

  <div class="server-line">
    <span id="serverDot" class="dot"></span>
    <span id="serverText">Local app: checking…</span>
    <button id="serverSync" class="link-btn" title="Push everything to the local server now">sync</button>
    <button id="serverEdit" class="link-btn" title="Change the local server URL">edit</button>
  </div>
  <div id="serverEditRow">
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8765" spellcheck="false" />
    <button id="serverSave">Save</button>
  </div>

  <label class="option-line" title="Off: checkout and PayPal pages are left alone (takes effect when they next load).">
    <input type="checkbox" id="checkoutAutomation" checked />
    <span>Checkout / PayPal automation<small>Automatic steps on Bandcamp checkout and PayPal pages</small></span>
  </label>

  <div id="seeTagsPanel" class="panel">
    <div class="tag-count" id="tagCount"></div>
    <div id="allTags"></div>
  </div>

  <div id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
